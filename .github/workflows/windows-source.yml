name: windows-source

# MinGW configure and build for the Windows client.
# Windows runtime fixes live in src/. MinGW dependency fixes are committed on
# the pinned submodule repos used by this branch.
#
# Artifacts contain the exe + config/docs only. Runtime DLLs (Wintun, MinGW
# libgcc/libstdc++/winpthread) are NOT bundled — obtain them from the official
# sources documented in docs/RUN-WINDOWS.md.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  mingw:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git pkg-config \
            mingw-w64 nsis automake libtool python3 librsvg2-bin icoutils zip
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      # Submodules used by this tip are public; default GITHUB_TOKEN is enough.
      - name: checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: record SHA
        run: |
          echo "SR_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD
          git status -sb

      - name: cache MinGW build tree
        uses: actions/cache@v4
        with:
          path: build/win32
          key: mingw-win32-source-${{ env.SR_SHA }}-${{ hashFiles('src/daemon/CMakeLists.txt', 'cmake/Version.cmake', '.gitmodules') }}

      - name: provide session_router.svg for ico
        run: |
          if [ ! -f contrib/session_router.svg ]; then
            cp -v contrib/lokinet.svg contrib/session_router.svg
          fi

      - name: configure
        run: |
          mkdir -p "$PWD/build/win32"
          ./contrib/windows-configure.sh "$PWD" "$PWD/build/win32" -DSROUTER_GUI=OFF

      - name: build
        run: |
          cmake --build "$PWD/build/win32" --parallel "$(nproc)" --target session-router

      - name: stage artifact
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp -v build/win32/session-router.exe artifact/

          # Client ini (Exit off) + bootstrap.signed + run docs
          cp -v contrib/packaging/session-router.ini artifact/session-router.ini
          cp -v .github/packaging/bootstrap.signed artifact/bootstrap.signed
          cp -v docs/RUN-WINDOWS.md artifact/RUN-WINDOWS.md
          cp -v docs/windows-client.md artifact/windows-client.md

          ls -la artifact/
          x86_64-w64-mingw32-objdump -f artifact/session-router.exe | head -5

          # Hard tests — exe + config only (no DLLs in the published artifact)
          test -f artifact/session-router.exe
          test -f artifact/session-router.ini
          test -f artifact/bootstrap.signed
          test "$(wc -c < artifact/bootstrap.signed)" -eq 434
          test -f artifact/RUN-WINDOWS.md
          # Refuse accidental DLL packaging
          ! ls artifact/*.dll >/dev/null 2>&1
          grep -qE '^enable=false$' artifact/session-router.ini
          grep -qE '^enabled=false$' artifact/session-router.ini
          grep -qE '^auto-routing=false$' artifact/session-router.ini
          grep -q 'ifaddr=10.192.0.1/16' artifact/session-router.ini || grep -q 'ifaddr=' artifact/session-router.ini
          echo "stage artifact OK (exe + config/docs; no DLLs)"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: session-router-windows-source-${{ env.SR_SHA }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
